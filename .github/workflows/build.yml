name: Build BABARPHANTOM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Repair ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ZIP NOT FOUND"
            exit 1
          fi

          zip -FF "$ZIP" --out repaired.zip

          unzip -t repaired.zip

      - name: Extract Project
        run: |
          mkdir source
          unzip -q repaired.zip -d source

      - name: Find Project
        run: |
          GRADLEW=$(find source -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BABARPHANTOM-APK
          path: source/**/build/outputs/apk/debug/*.apk
